<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5, minimum-scale=0.8">
  <title>🎵 英日学歌智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0f0e17;--s1:#1a1a2e;--s2:#232340;--s3:#2d2d50;--acc:#6c63ff;--acc2:#a78bfa;--text:#ebebeb;--text2:#9a9ab0;--text3:#6a6a80;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--cyan:#22d3ee;--pink:#f472b6;--border:#2e2e4a;--radius:12px}
    body{font-family:'Noto Sans SC','Noto Sans JP',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    .header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .logo{font-size:1.1em;font-weight:700;display:flex;align-items:center;gap:5px}
    .logo .hl{color:var(--acc2)}
    .speed-btn{background:var(--s2);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:20px;font-size:.76em;cursor:pointer;transition:.2s}
    .speed-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
    .tabs{display:flex;gap:3px;overflow-x:auto}
    .tab{background:none;border:none;color:var(--text3);padding:7px 12px;border-radius:8px;font-size:.82em;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap}
    .tab:hover{color:var(--text2);background:var(--s2)}
    .tab.active{background:var(--acc);color:#fff}
    .main{max-width:860px;margin:0 auto;padding:12px;min-height:calc(100vh - 100px)}
    .lang-filters{display:flex;gap:5px;margin-bottom:10px}
    .lang-filter{background:var(--s2);border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:20px;font-size:.78em;cursor:pointer;transition:.2s;font-family:inherit}
    .lang-filter.active{background:var(--acc);color:#fff;border-color:var(--acc)}
    .song-grid{display:grid;gap:10px;grid-template-columns:1fr}
    .song-card{background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
    .song-card:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 6px 24px rgba(108,99,255,.15)}
    .song-card.custom{border-left:3px solid var(--yellow)}
    .song-title-card{font-size:1.05em;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
    .song-artist{font-size:.8em;color:var(--text2);margin-bottom:6px}
    .song-meta{display:flex;align-items:center;gap:10px;font-size:.75em;color:var(--text3)}
    .lang-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.7em;font-weight:600;margin-left:6px;vertical-align:middle}
    .lang-badge.en{background:rgba(99,102,241,.2);color:#818cf8}
    .lang-badge.ja{background:rgba(244,114,182,.2);color:var(--pink)}
    .card-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
    .del-card-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--red);background:rgba(248,113,113,.15);color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7em;transition:.2s}
    .del-card-btn:hover{background:var(--red);color:#fff}

    .lyrics-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .back-btn{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.83em;transition:.2s}
    .back-btn:hover{border-color:var(--acc);color:var(--acc2)}
    .lyrics-song-title{font-size:1.1em;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lyrics-controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
    .ctrl-btn{background:var(--s2);border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:20px;font-size:.76em;cursor:pointer;transition:.2s;font-family:inherit;white-space:nowrap}
    .ctrl-btn:hover{border-color:var(--acc);color:var(--acc2)}
    .ctrl-btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
    .save-song-btn{background:var(--green);color:#000;border:1px solid var(--green);padding:5px 12px;border-radius:20px;font-size:.76em;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:600;transition:.2s}
    .save-song-btn:hover{background:#22c55e;border-color:#22c55e}

    .lyric-line{margin-bottom:10px;padding:10px;border-radius:var(--radius);background:var(--s1);border:1px solid transparent;transition:.2s}
    .lyric-line:hover{border-color:var(--border)}
    .line-en{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 0;line-height:2.1}
    .line-en.interlinear{align-items:flex-start;gap:3px 2px;line-height:1.3}
    .word{padding:2px 4px;border-radius:6px;cursor:pointer;transition:.15s;display:inline-block;font-size:1.02em}
    .word:hover{background:rgba(108,99,255,.2);color:var(--acc2)}
    .word.in-vocab{border-bottom:2px solid var(--green)}
    .word.blank{background:var(--s3);color:transparent;min-width:48px;text-align:center;border:1px dashed var(--acc);user-select:none}
    .word.blank.revealed{color:var(--green);background:rgba(74,222,128,.1);border-color:var(--green)}
    .wg{display:inline-flex;flex-direction:column;align-items:center;padding:4px 5px;border-radius:8px;cursor:pointer;transition:.15s;vertical-align:top;min-width:30px}
    .wg:hover{background:rgba(108,99,255,.18)}
    .wg.in-vocab{box-shadow:inset 0 -2px 0 var(--green)}
    .wg-en{font-size:1em;color:#fff;font-weight:500;white-space:nowrap}
    .wg-ph{font-size:.65em;color:var(--acc2);font-style:italic;white-space:nowrap;margin-top:1px}
    .wg-zh{font-size:.7em;color:var(--green);white-space:nowrap;margin-top:1px}
    .wg-unknown{color:var(--text3)}
    .wg.blank-wg .wg-en{background:var(--s3);color:transparent;padding:0 8px;border-radius:4px;border:1px dashed var(--acc);min-width:40px}
    .wg.blank-wg .wg-zh{color:transparent}
    .wg.blank-wg.revealed .wg-en{color:var(--green);background:rgba(74,222,128,.1);border-color:var(--green)}
    .wg.blank-wg.revealed .wg-zh{color:var(--green)}
    .wg-rd{font-size:.62em;color:var(--pink);white-space:nowrap;margin-bottom:1px;font-style:normal}
    .ja-word{font-size:1.05em}
    .line-play{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--s2);border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:.68em;margin-right:3px;transition:.2s;flex-shrink:0}
    .line-play:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
    .line-play.il-play{align-self:center;margin-top:4px}
    .line-zh{font-size:.82em;color:var(--cyan);padding-left:4px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--border);line-height:1.6}
    .line-zh .label{color:var(--text3);font-size:.9em;margin-right:4px}

    .word-panel{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);transform:translateY(100%);transition:.35s cubic-bezier(.4,0,.2,1);z-index:200;max-height:55vh;overflow-y:auto;border-radius:20px 20px 0 0}
    .word-panel.open{transform:translateY(0)}
    .wp-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:8px auto}
    .wp-content{padding:4px 18px 24px}
    .wp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
    .wp-word{font-size:1.5em;font-weight:700;color:#fff}
    .wp-phonetic{font-size:.92em;color:var(--acc2);margin-top:2px;font-style:italic}
    .wp-reading{font-size:.92em;color:var(--pink);margin-top:2px}
    .wp-pos{display:inline-block;background:var(--s3);color:var(--text2);padding:2px 8px;border-radius:4px;font-size:.73em;margin-top:5px}
    .wp-meaning{font-size:1.1em;color:var(--text);margin:10px 0;padding:10px;background:var(--s2);border-radius:8px;border-left:3px solid var(--acc)}
    .wp-actions{display:flex;gap:8px;flex-wrap:wrap}
    .wp-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:.83em;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;gap:4px}
    .wp-btn:hover{border-color:var(--acc);color:var(--acc2)}
    .wp-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
    .wp-btn.danger{border-color:var(--red);color:var(--red)}
    .wp-close{background:none;border:none;color:var(--text3);font-size:1.4em;cursor:pointer;padding:4px}

    .custom-area{display:flex;flex-direction:column;gap:10px}
    .custom-lang-toggle{display:flex;gap:6px;margin-bottom:2px}
    .cl-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--text2);cursor:pointer;font-family:inherit;font-size:.85em;transition:.2s}
    .cl-btn.active{border-color:var(--acc);background:var(--acc);color:#fff}
    .custom-textarea{width:100%;min-height:170px;background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:12px;color:var(--text);font-size:.92em;font-family:inherit;resize:vertical;line-height:1.8}
    .custom-textarea::placeholder{color:var(--text3)}
    .custom-textarea:focus{outline:none;border-color:var(--acc)}
    .custom-submit{align-self:flex-end}
    .format-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:.82em;line-height:1.8}
    .format-box code{background:var(--s3);padding:2px 6px;border-radius:4px;color:var(--acc2);font-size:.92em}
    .format-title{font-weight:600;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:4px}
    .format-ex{color:var(--text3);margin:4px 0;padding-left:8px;border-left:2px solid var(--border)}

    .vocab-empty{text-align:center;padding:50px 20px;color:var(--text3)}
    .vocab-empty .icon{font-size:2.8em;margin-bottom:10px;display:block}
    .vocab-list{display:flex;flex-direction:column;gap:7px}
    .vocab-item{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px}
    .vocab-word{font-size:1.02em;font-weight:600;min-width:70px}
    .vocab-info{flex:1;min-width:0}
    .vocab-phonetic{font-size:.78em;color:var(--acc2);font-style:italic}
    .vocab-reading{font-size:.78em;color:var(--pink)}
    .vocab-meaning{font-size:.82em;color:var(--text2);margin-top:1px}
    .vocab-actions{display:flex;gap:5px;flex-shrink:0}
    .vocab-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--s2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.82em;transition:.2s}
    .vocab-btn:hover{border-color:var(--acc);color:var(--acc2)}
    .vocab-btn.del:hover{border-color:var(--red);color:var(--red)}
    .vocab-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
    .vocab-count{font-size:.82em;color:var(--text3)}
    .flashcard-btn{background:var(--acc);color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.83em}

    .fc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .fc-card{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:36px 24px;text-align:center;max-width:340px;width:100%;position:relative;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
    .fc-progress{position:absolute;top:14px;right:18px;font-size:.8em;color:var(--text3)}
    .fc-word{font-size:1.9em;font-weight:700}
    .fc-phonetic{font-size:.95em;color:var(--acc2);font-style:italic}
    .fc-reading{font-size:.95em;color:var(--pink)}
    .fc-meaning{font-size:1.15em;color:var(--green);min-height:28px}
    .fc-btns{display:flex;gap:8px;margin-top:8px}
    .fc-btn{padding:9px 18px;border-radius:10px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:.88em;cursor:pointer;font-family:inherit;transition:.2s}
    .fc-btn:hover{border-color:var(--acc);color:var(--acc2)}
    .fc-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
    .fc-close{position:absolute;top:12px;left:14px;background:none;border:none;color:var(--text3);font-size:1.3em;cursor:pointer}

    .section-title{font-size:.88em;color:var(--text3);margin-bottom:10px;padding-left:2px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:.3s}
    .overlay.show{opacity:1;pointer-events:auto}

    @media(min-width:520px){.song-grid{grid-template-columns:1fr 1fr}}
    @media(min-width:600px){
      .word-panel{left:50%;right:auto;transform:translate(-50%,100%);width:440px;border-radius:20px 20px 0 0}
      .word-panel.open{transform:translate(-50%,0)}
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .lyric-line{animation:fadeUp .3s ease both}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}
  </style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <div class="logo">🎵 <span class="hl">学歌</span>智能体</div>
    <button class="speed-btn" id="speedBtn" onclick="toggleSpeed()">🐢 慢速</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main class="main" id="main"></main>
<div class="overlay" id="overlay" onclick="closeWordPanel()"></div>
<div class="word-panel" id="wordPanel">
  <div class="wp-handle"></div>
  <div class="wp-content" id="wpContent"></div>
</div>
<script>
  (function(){
    // ==================== EN DICT ====================
    const D={
    "a":{p:"/ə/",m:"一个",s:"冠词"},"about":{p:"/əˈbaʊt/",m:"关于",s:"介词"},"above":{p:"/əˈbʌv/",m:"在…上方",s:"介词"},"again":{p:"/əˈɡen/",m:"再次",s:"副词"},"all":{p:"/ɔːl/",m:"所有的",s:"形容词"},"always":{p:"/ˈɔːlweɪz/",m:"总是",s:"副词"},"am":{p:"/æm/",m:"是(I am)",s:"动词"},"amazing":{p:"/əˈmeɪzɪŋ/",m:"令人惊叹的",s:"形容词"},"an":{p:"/ən/",m:"一个",s:"冠词"},"and":{p:"/ænd/",m:"和",s:"连词"},"appear":{p:"/əˈpɪr/",m:"出现",s:"动词"},"are":{p:"/ɑːr/",m:"是",s:"动词"},"arms":{p:"/ɑːrmz/",m:"手臂",s:"名词"},"as":{p:"/æz/",m:"像；当",s:"连词"},"at":{p:"/æt/",m:"在",s:"介词"},"away":{p:"/əˈweɪ/",m:"离开",s:"副词"},"awoke":{p:"/əˈwoʊk/",m:"醒来(过去式)",s:"动词"},
    "baby":{p:"/ˈbeɪbi/",m:"宝贝",s:"名词"},"back":{p:"/bæk/",m:"回来",s:"副词"},"be":{p:"/biː/",m:"是",s:"动词"},"beautiful":{p:"/ˈbjuːtɪfl/",m:"美丽的",s:"形容词"},"because":{p:"/bɪˈkɔːz/",m:"因为",s:"连词"},"been":{p:"/biːn/",m:"是(过去分词)",s:"动词"},"before":{p:"/bɪˈfɔːr/",m:"在…之前",s:"介词"},"believe":{p:"/bɪˈliːv/",m:"相信",s:"动词"},"believed":{p:"/bɪˈliːvd/",m:"相信了",s:"动词"},"blind":{p:"/blaɪnd/",m:"盲的",s:"形容词"},"blazing":{p:"/ˈbleɪzɪŋ/",m:"炽热的",s:"形容词"},"blue":{p:"/bluː/",m:"蓝色的",s:"形容词"},"bright":{p:"/braɪt/",m:"明亮的",s:"形容词"},"but":{p:"/bʌt/",m:"但是",s:"连词"},"by":{p:"/baɪ/",m:"被；通过",s:"介词"},
    "call":{p:"/kɔːl/",m:"叫",s:"动词"},"came":{p:"/keɪm/",m:"来(过去式)",s:"动词"},"can":{p:"/kæn/",m:"能",s:"动词"},"can't":{p:"/kænt/",m:"不能",s:"动词"},"come":{p:"/kʌm/",m:"来",s:"动词"},"could":{p:"/kʊd/",m:"能(过去式)",s:"动词"},"cried":{p:"/kraɪd/",m:"哭了",s:"动词"},
    "dance":{p:"/dæns/",m:"跳舞",s:"动词"},"dark":{p:"/dɑːrk/",m:"黑暗的",s:"形容词"},"darling":{p:"/ˈdɑːrlɪŋ/",m:"亲爱的",s:"名词"},"day":{p:"/deɪ/",m:"天",s:"名词"},"days":{p:"/deɪz/",m:"日子",s:"名词"},"dear":{p:"/dɪr/",m:"亲爱的",s:"形容词"},"deep":{p:"/diːp/",m:"深的",s:"形容词"},"diamond":{p:"/ˈdaɪmənd/",m:"钻石",s:"名词"},"did":{p:"/dɪd/",m:"做(过去式)",s:"动词"},"didn't":{p:"/ˈdɪdnt/",m:"没有",s:"动词"},"do":{p:"/duː/",m:"做",s:"动词"},"don't":{p:"/doʊnt/",m:"不要",s:"动词"},"down":{p:"/daʊn/",m:"向下",s:"副词"},"dream":{p:"/driːm/",m:"梦",s:"名词"},"dreamed":{p:"/driːmd/",m:"梦见",s:"动词"},
    "every":{p:"/ˈevri/",m:"每个",s:"形容词"},"everything":{p:"/ˈevriθɪŋ/",m:"一切",s:"代词"},"eyes":{p:"/aɪz/",m:"眼睛",s:"名词"},

      tab:'library', songIdx:null, customLines:null, customLang:'en',
      selectedWord:null, curLang:null,
      showSentTrans:true, showWordTrans:false, showPhonetic:false,
      practiceMode:false, slowMode:false,
      vocab:[], revealedBlanks:new Set(),
      libFilter:'all',
      learningSource:'library'
    };

    // ==================== SPEECH ====================
    function speak(text,slow,lang){
      if(!('speechSynthesis' in window))return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const l=lang||st.curLang||'en';
      u.lang=l==='ja'?'ja-JP':'en-US';
      u.rate=(slow||st.slowMode)?0.5:(l==='ja'?0.78:0.82);u.pitch=1;
      speechSynthesis.speak(u);
    }

    // ==================== UTILS ====================
    function cw(w){return w.replace(/[.,!?;:'"()\[\]—–…""''、。！？「」『』]/g,'').toLowerCase().trim();}
    function lookupEN(w){return D[cw(w)]||null;}
    function inVocab(w,lang){return st.vocab.some(v=>v.word===w && v.lang===(lang||st.curLang));}
    function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;');}
    function diffStars(n){return '⭐'.repeat(n);}

    let jaWordMap={};
    function buildJaMap(song){
      jaWordMap={};
      if(song.lang!=='ja')return;
      song.lines.forEach(l=>{
        if(!l.w)return;
        pJW(l.w).forEach(wd=>{if(wd.w&&!jaWordMap[wd.w])jaWordMap[wd.w]=wd;});
      });
    }
    function lookupJA(w){return jaWordMap[w]||null;}

    // ==================== LOCAL STORAGE FOR CUSTOM SONGS ====================
    const SAVED_KEY = 'savedCustomSongs_v2';
    function getSavedSongs(){
      try{return JSON.parse(localStorage.getItem(SAVED_KEY))||[];}catch(e){return[];}
    }
    function saveSongsToStorage(songs){
      localStorage.setItem(SAVED_KEY, JSON.stringify(songs));
    }

    function saveCurrentCustom(){
      if(!st.customLines || !st.customLines.length) return;
      const lines = st.customLines;
      const lang = st.customLang;
      const firstLine = lines.find(l=>l.t && l.t.trim())?.t || '未命名';
      const cleanFirst = firstLine.replace(/\{[^}]*\}/g,'').replace(/\s+/g,' ').trim();
      const title = cleanFirst.slice(0, 30) + (cleanFirst.length > 30 ? '…' : '');
      const saved = getSavedSongs();
      const exists = saved.some(s => s.title === title && s.lang === lang && s.lines.length === lines.length);
      if(exists){
        alert('⚠️ 这首歌似乎已经保存过了。');
        return;
      }
      saved.push({ id: Date.now(), title: title, lang: lang, lines: lines });
      saveSongsToStorage(saved);
      alert('✅ 歌曲已保存！可到“歌曲库”查看。');
      render();
    }

    function deleteCustomSong(id){
      if(!confirm('确定要删除这首歌吗？')) return;
      const saved = getSavedSongs().filter(s => s.id !== id);
      saveSongsToStorage(saved);
      render();
    }

    function loadCustomSongById(id){
      const song = getSavedSongs().find(s => s.id === id);
      if(!song) return;
      st.customLines = song.lines;
      st.customLang = song.lang;
      st.songIdx = null;
      st.learningSource = 'library';
      st.practiceMode = false;
      st.revealedBlanks.clear();
      if(st.customLang==='ja'){
        jaWordMap={};
        st.customLines.forEach(l=>{
          if(l.w && Array.isArray(l.w)){
            l.w.forEach(wd=>{if(wd.w && wd.r && !jaWordMap[wd.w]) jaWordMap[wd.w]=wd;});
          }
        });
      }
      render();
    }

    // ==================== RENDER ====================
    function render(){
      const tabsEl=document.getElementById('tabs');
      const td=[{id:'library',l:'🎵 歌曲库'},{id:'custom',l:'✏️ 自定义'},{id:'vocab',l:`📚 生词(${st.vocab.length})`}];
      tabsEl.innerHTML=td.map(t=>`<button class="tab ${st.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.l}</button>`).join('');
      const main=document.getElementById('main');
      if(st.tab==='library'&&st.songIdx===null&&!st.customLines) main.innerHTML=renderLibrary();
      else if(st.tab==='custom'&&!st.customLines) main.innerHTML=renderCustom();
      else if(st.tab==='vocab') main.innerHTML=renderVocab();
      else main.innerHTML=renderLyrics();
      document.getElementById('speedBtn').className='speed-btn'+(st.slowMode?' active':'');
      document.getElementById('speedBtn').textContent=st.slowMode?'🐢 慢速中':'🐢 慢速';
    }

    function getCombinedSongs(){
      const builtin = SONGS.map((s,i)=>({...s, type:'builtin', index:i}));
      const custom = getSavedSongs().map(s=>({
        title:s.title, tZh:'自定义', artist:'我的保存', lang:s.lang, diff:0, emoji:'💾', color:'#fbbf24',
        lines:s.lines, type:'custom', id:s.id
      }));
      return [...builtin, ...custom];
    }

    function renderLibrary(){
      const allSongs = getCombinedSongs();
      const filtered = allSongs.filter(s => st.libFilter==='all' || s.lang===st.libFilter);
      return `<div class="section-title">📂 选择一首歌曲开始学习</div>
      <div class="lang-filters">
        <button class="lang-filter ${st.libFilter==='all'?'active':''}" onclick="setFilter('all')">🌐 全部</button>
        <button class="lang-filter ${st.libFilter==='en'?'active':''}" onclick="setFilter('en')">🇺🇸 英语</button>
        <button class="lang-filter ${st.libFilter==='ja'?'active':''}" onclick="setFilter('ja')">🇯🇵 日语</button>
      </div>
      <div class="song-grid">${filtered.map(s=>`
        <div class="song-card ${s.type==='custom'?'custom':''}" style="${s.type==='custom'?'':'border-left:3px solid '+s.color}" data-custom-id="${s.type==='custom'?s.id:''}" data-builtin-index="${s.type==='builtin'?s.index:''}">
          <div style="font-size:1.6em;margin-bottom:4px">${s.emoji}</div>
          <div class="song-title-card">${s.title}<span class="lang-badge ${s.lang}">${s.lang==='ja'?'日本語':'EN'}</span></div>
          <div class="song-artist">${s.tZh} · ${s.artist}</div>
          <div class="song-meta"><span>${s.type==='custom'?'自定义':diffStars(s.diff)}</span><span>${s.lines.filter(l=>l.t).length}行</span></div>
          ${s.type==='custom'?`<div class="card-actions"><button class="del-card-btn" onclick="event.stopPropagation();deleteCustomSong(${s.id})" title="删除">✕</button></div>`:''}
        </div>`).join('')}</div>`;
    }

    function renderCustom(){
      return `<div class="custom-area">
        <div class="section-title">✏️ 粘贴歌词，支持英语和日语（用 <code>|</code> 分隔原文和翻译）</div>
        <div class="custom-lang-toggle">
          <button class="cl-btn ${st.customLang==='en'?'active':''}" onclick="st.customLang='en';render()">🇺🇸 英语歌词</button>
          <button class="cl-btn ${st.customLang==='ja'?'active':''}" onclick="st.customLang='ja';render()">🇯🇵 日语歌词</button>
        </div>
        ${st.customLang==='en'?`
        <div class="format-box">
          <div class="format-title">📌 英语歌词格式</div>
          <div style="color:var(--text2);margin-bottom:4px">每行一句，用 <code>|</code> 分隔英文和中文翻译：</div>
          <div class="format-ex">Let it be, let it be | 顺其自然<br>Whisper words of wisdom | 轻声说出智慧的话语</div>
          <div style="color:var(--text3);margin-top:4px;font-size:.9em">💡 不写翻译也可以，但不会显示句子翻译。</div>
        </div>`:`
        <div class="format-box">
          <div class="format-title">📌 日语歌词格式</div>
          <div style="color:var(--text2);margin-bottom:4px">每行一句，<b>单词之间用空格分开</b>，用 <code>|</code> 分隔日文和中文翻译。</div>
          <div style="color:var(--text2);margin-bottom:4px">可用 <code>{读音,释义}</code> 标注单词：</div>
          <div class="format-ex">上{うえ,上方}を 向いて{むいて,朝向} 歩こう{あるこう,走吧} | 仰起头来走吧<br>涙{なみだ,眼泪}が こぼれない ように | 为了不让眼泪掉下来</div>
          <div style="color:var(--text3);margin-top:4px;font-size:.9em">💡 不写标注也可以，空格分词即可点击学习每个词。</div>
        </div>`}
        <textarea class="custom-textarea" id="customText" placeholder="${st.customLang==='en'?'粘贴英文歌词...\n\nLet it be | 顺其自然':'粘贴日语歌词（用空格分词）...\n\nきらきら 光る{ひかる,发光} | 闪闪发光'}"></textarea>
        <button class="wp-btn primary custom-submit" onclick="startCustom()">🚀 开始学习</button>
      </div>`;
    }

    function renderLyrics(){
      let song,lines,title,lang,isCustom=false;
      if(st.customLines){
        lines=st.customLines; title='📝 自定义歌词'; lang=st.customLang; isCustom=true;
      } else {
        song=SONGS[st.songIdx]; lines=song.lines; title=(song.lang==='ja'?'🎵 ':'🎵 ')+song.title; lang=song.lang;
        buildJaMap(song);
      }
      st.curLang=lang;
      const isJA=lang==='ja';
      const readingLabel=isJA?'📝 假名注音':'📝 音标';

      let html=`<div class="lyrics-header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="lyrics-song-title">${title} <span class="lang-badge ${lang}">${isJA?'日本語':'EN'}</span></div>
        ${isCustom ? `<button class="save-song-btn" onclick="saveCurrentCustom()">💾 保存到歌曲库</button>` : ''}
      </div>
      <div class="lyrics-controls">
        <button class="ctrl-btn ${st.showSentTrans?'on':''}" onclick="toggle('showSentTrans')">📖 句子翻译</button>
        <button class="ctrl-btn ${st.showWordTrans?'on':''}" onclick="toggle('showWordTrans')">🔤 逐字翻译</button>
        <button class="ctrl-btn ${st.showPhonetic?'on':''}" onclick="toggle('showPhonetic')">${readingLabel}</button>
        <button class="ctrl-btn ${st.practiceMode?'on':''}" onclick="toggle('practiceMode')">🧩 练习</button>
        <button class="ctrl-btn" onclick="speakAll()">🔊 朗读全文</button>
      </div><div>`;

      lines.forEach((line,li)=>{
        if(!line.t){html+='<div style="height:8px"></div>';return;}
        html+=`<div class="lyric-line" style="animation-delay:${li*0.04}s">`;
        if(isJA) html+=renderJALine(line,li,isCustom);
        else html+=renderENLine(line,li,isCustom);
        if(st.showSentTrans){
          if(line.z) html+=`<div class="line-zh"><span class="label">🇨🇳</span>${line.z}</div>`;
          else if(isCustom) html+=`<div class="line-zh" style="opacity:.5;font-style:italic"><span class="label">📝</span>未提供翻译</div>`;
        }
        html+=`</div>`;
      });
      html+=`</div>`;
      return html;
    }

    function renderENLine(line,li,isCustom){
      const words=line.t.split(/\s+/).filter(Boolean);
      let h='';
      if(st.showWordTrans||st.showPhonetic){
        h+=`<div class="line-en interlinear"><span class="line-play il-play" onclick="speakLine(\`${esc(line.t)}\`,'en')">▶</span>`;
        words.forEach((w,wi)=>{
          const c=cw(w),info=D[c],iv=inVocab(c,'en');
          const isBlank=st.practiceMode&&iv;
          const revealed=st.revealedBlanks.has(`${li}-${wi}`);
          let cls='wg'+(iv?' in-vocab':'')+(isBlank&&!revealed?' blank-wg':'')+(isBlank&&revealed?' blank-wg revealed':'');
          h+=`<div class="${cls}" onclick="${isBlank&&!revealed?`revealBlank(${li},${wi},'${esc(c)}','en')`:`selectWordEN('${esc(c)}')`}"><span class="wg-en">${w}</span>`;
          if(st.showPhonetic) h+=`<span class="wg-ph">${info?info.p:'·'}</span>`;
          if(st.showWordTrans) h+=`<span class="wg-zh ${info?'':'wg-unknown'}">${info?info.m:'?'}</span>`;
          h+=`</div>`;
        });
        h+=`</div>`;
      } else {
        h+=`<div class="line-en"><span class="line-play" onclick="speakLine(\`${esc(line.t)}\`,'en')">▶</span>`;
        words.forEach((w,wi)=>{
          const c=cw(w),iv=inVocab(c,'en');
          const isBlank=st.practiceMode&&iv;
          const revealed=st.revealedBlanks.has(`${li}-${wi}`);
          let cls='word';
          if(iv&&!st.practiceMode) cls+=' in-vocab';
          if(isBlank&&!revealed) cls+=' blank';
          if(isBlank&&revealed) cls+=' blank revealed';
          if(isBlank&&!revealed) h+=`<span class="${cls}" onclick="revealBlank(${li},${wi},'${esc(c)}','en')">${w}</span> `;
          else h+=`<span class="${cls}" onclick="selectWordEN('${esc(c)}')">${w}</span> `;
        });
        h+=`</div>`;
      }
      return h;
    }

    function renderJALine(line,li,isCustom){
      let wds=[];
      if(line.w && typeof line.w==='string') wds=pJW(line.w);
      else if(line.w && Array.isArray(line.w)) wds=line.w;
      else {
        const parts=line.t.split(/\s+/).filter(Boolean);
        wds=parts.map(p=>{
          const m=p.match(/^(.+?)\{([^}]*)\}$/);
          if(m){const ann=m[2].split(',');return{w:m[1],r:ann[0]||'',m:ann[1]||''};}
          const info=jaWordMap[p];
          if(info) return info;
          return{w:p,r:'',m:''};
        });
      }
      let h='';
      if(st.showWordTrans||st.showPhonetic){
        h+=`<div class="line-en interlinear"><span class="line-play il-play" onclick="speakLine(\`${esc(line.t.replace(/\{[^}]*\}/g,''))}\`,'ja')">▶</span>`;
        wds.forEach((wd,wi)=>{
          const iv=inVocab(wd.w,'ja');
          const isBlank=st.practiceMode&&iv;
          const revealed=st.revealedBlanks.has(`${li}-${wi}`);
          let cls='wg'+(iv?' in-vocab':'')+(isBlank&&!revealed?' blank-wg':'')+(isBlank&&revealed?' blank-wg revealed':'');
          h+=`<div class="${cls}" onclick="${isBlank&&!revealed?`revealBlankJA(${li},${wi},'${esc(wd.w)}')`:`selectWordJA('${esc(wd.w)}','${esc(wd.r)}','${esc(wd.m)}')`}">`;
          if(st.showPhonetic&&wd.r) h+=`<span class="wg-rd">${wd.r}</span>`;
          h+=`<span class="wg-en ja-word">${wd.w}</span>`;
          if(st.showWordTrans) h+=`<span class="wg-zh ${wd.m?'':'wg-unknown'}">${wd.m||'·'}</span>`;
          h+=`</div>`;
        });
        h+=`</div>`;
      } else {
        h+=`<div class="line-en"><span class="line-play" onclick="speakLine(\`${esc(line.t.replace(/\{[^}]*\}/g,''))}\`,'ja')">▶</span>`;
        wds.forEach((wd,wi)=>{
          const iv=inVocab(wd.w,'ja');
          const isBlank=st.practiceMode&&iv;
          const revealed=st.revealedBlanks.has(`${li}-${wi}`);
          let cls='word ja-word';
          if(iv&&!st.practiceMode) cls+=' in-vocab';
          if(isBlank&&!revealed) cls+=' blank';
          if(isBlank&&revealed) cls+=' blank revealed';
          if(isBlank&&!revealed) h+=`<span class="${cls}" onclick="revealBlankJA(${li},${wi},'${esc(wd.w)}')">${wd.w}</span> `;
          else h+=`<span class="${cls}" onclick="selectWordJA('${esc(wd.w)}','${esc(wd.r)}','${esc(wd.m)}')">${wd.w}</span> `;
        });
        h+=`</div>`;
      }
      return h;
    }

    function renderVocab(){
      if(!st.vocab.length) return `<div class="vocab-empty"><span class="icon">📚</span><div style="font-size:1.05em;margin-bottom:6px">生词本是空的</div><div style="font-size:.82em">学习歌曲时，点击单词并收藏到生词本</div></div>`;
      return `<div class="vocab-header"><div class="section-title" style="margin:0">📚 我的生词本</div><div style="display:flex;gap:8px;align-items:center"><span class="vocab-count">${st.vocab.length} 个单词</span><button class="flashcard-btn" onclick="startFC()">🃏 闪卡复习</button></div></div>
      <div class="vocab-list">${st.vocab.map((v,i)=>`
        <div class="vocab-item">
          <div class="vocab-word">${v.word} <span class="lang-badge ${v.lang}" style="font-size:.6em">${v.lang==='ja'?'JP':'EN'}</span></div>
          <div class="vocab-info">
            ${v.lang==='ja'&&v.reading?`<div class="vocab-reading">${v.reading}</div>`:''}
            ${v.lang==='en'&&v.phonetic?`<div class="vocab-phonetic">${v.phonetic}</div>`:''}
            <div class="vocab-meaning">${v.meaning||'(未收录)'}</div>
          </div>
          <div class="vocab-actions">
            <button class="vocab-btn" onclick="speak('${esc(v.word)}',false,'${v.lang}')">🔊</button>
            <button class="vocab-btn del" onclick="removeVocab(${i})">✕</button>
          </div>
        </div>`).join('')}</div>`;
    }

    // ==================== WORD PANEL ====================
    function openWP_EN(word){
      const info=D[word];
      const iv=inVocab(word,'en');
      document.getElementById('wpContent').innerHTML=`
        <div class="wp-header"><div>
          <div class="wp-word">${word}</div>
          ${info?`<div class="wp-phonetic">${info.p}</div><span class="wp-pos">${info.s}</span>`:`<div class="wp-phonetic" style="color:var(--text3)">词典暂未收录</div>`}
        </div><button class="wp-close" onclick="closeWordPanel()">✕</button></div>
        ${info?`<div class="wp-meaning">🇨🇳 ${info.m}</div>`:'<div class="wp-meaning" style="border-color:var(--text3)">暂无释义</div>'}
        <div class="wp-actions">
          <button class="wp-btn primary" onclick="speak('${esc(word)}',false,'en')">🔊 发音</button>
          <button class="wp-btn" onclick="speak('${esc(word)}',true,'en')">🐢 慢读</button>
          ${!iv?`<button class="wp-btn" onclick="addVocabEN('${esc(word)}')" style="border-color:var(--green);color:var(--green)">⭐ 收藏</button>`
              :`<button class="wp-btn danger" onclick="rmVocabW('${esc(word)}','en')">✕ 移出</button>`}
        </div>`;
      showPanel();
    }

    function openWP_JA(word,reading,meaning){
      const iv=inVocab(word,'ja');
      if(!reading||!meaning){const info=lookupJA(word);if(info){reading=reading||info.r;meaning=meaning||info.m;}}
      document.getElementById('wpContent').innerHTML=`
        <div class="wp-header"><div>
          <div class="wp-word">${word}</div>
          ${reading?`<div class="wp-reading">【${reading}】</div>`:''}
        </div><button class="wp-close" onclick="closeWordPanel()">✕</button></div>
        ${meaning?`<div class="wp-meaning">🇨🇳 ${meaning}</div>`:'<div class="wp-meaning" style="border-color:var(--text3)">暂无释义，点击发音听读音</div>'}
        <div class="wp-actions">
          <button class="wp-btn primary" onclick="speak('${esc(word)}',false,'ja')">🔊 发音</button>
          <button class="wp-btn" onclick="speak('${esc(word)}',true,'ja')">🐢 慢读</button>
          ${!iv?`<button class="wp-btn" onclick="addVocabJA('${esc(word)}','${esc(reading)}','${esc(meaning)}')" style="border-color:var(--green);color:var(--green)">⭐ 收藏</button>`
              :`<button class="wp-btn danger" onclick="rmVocabW('${esc(word)}','ja')">✕ 移出</button>`}
        </div>`;
      showPanel();
    }

    function showPanel(){document.getElementById('wordPanel').classList.add('open');document.getElementById('overlay').classList.add('show');}
    function closeWordPanel(){document.getElementById('wordPanel').classList.remove('open');document.getElementById('overlay').classList.remove('show');}

    // ==================== FLASHCARD ====================
    let fc={idx:0,show:false};
    function startFC(){if(!st.vocab.length)return;fc={idx:0,show:false};renderFC();}
    function renderFC(){
      const v=st.vocab[fc.idx];
      let el=document.getElementById('fcOverlay');
      if(!el){el=document.createElement('div');el.id='fcOverlay';el.className='fc-overlay';document.body.appendChild(el);}
      el.style.display='flex';
      const isJA=v.lang==='ja';
      el.innerHTML=`<div class="fc-card">
        <button class="fc-close" onclick="closeFC()">✕</button>
        <div class="fc-progress">${fc.idx+1}/${st.vocab.length}</div>
        <div class="fc-word">${v.word} <span class="lang-badge ${v.lang}" style="font-size:.4em;vertical-align:middle">${isJA?'JP':'EN'}</span></div>
        ${isJA&&v.reading?`<div class="fc-reading">【${v.reading}】</div>`:''}
        ${!isJA&&v.phonetic?`<div class="fc-phonetic">${v.phonetic}</div>`:''}
        <div class="fc-meaning">${fc.show?(v.meaning||'无释义'):'点击按钮查看释义'}</div>
        <div class="fc-btns">
          <button class="fc-btn" onclick="speak('${esc(v.word)}',false,'${v.lang}')">🔊</button>
          ${!fc.show?`<button class="fc-btn primary" onclick="fc.show=true;renderFC()">👀 查看</button>`
                  :`<button class="fc-btn primary" onclick="fc.idx=(fc.idx+1)%st.vocab.length;fc.show=false;renderFC()">→ 下一个</button>`}
        </div></div>`;
    }
    function closeFC(){const el=document.getElementById('fcOverlay');if(el)el.style.display='none';}

    // ==================== ACTIONS ====================
    window.switchTab = function(tab){
      st.tab=tab;
      if(tab==='library'){ st.songIdx=null; st.customLines=null; st.learningSource='library'; }
      if(tab==='custom'){ st.songIdx=null; }
      if(tab==='vocab'){ st.songIdx=null; st.customLines=null; }
      st.practiceMode=false; st.revealedBlanks.clear();
      closeWordPanel(); render();
    };
    window.setFilter = function(f){st.libFilter=f;render();};
    window.selectSong = function(i){
      st.songIdx=i; st.customLines=null; st.learningSource='library';
      st.practiceMode=false; st.revealedBlanks.clear();
      if(SONGS[i].lang==='ja') buildJaMap(SONGS[i]);
      render();
    };
    window.startCustom = function(){
      const t=document.getElementById('customText').value.trim();
      if(!t)return;
      if(st.customLang==='ja'){
        st.customLines=t.split('\n').map(line=>{
          const parts=line.split('|');
          const raw=(parts[0]||'').trim();
          const zh=(parts[1]||'').trim();
          const wds=raw.split(/\s+/).filter(Boolean).map(p=>{
            const m=p.match(/^(.+?)\{([^}]*)\}$/);
            if(m){const ann=m[2].split(',');return{w:m[1],r:ann[0]||'',m:ann[1]||''};}
            return{w:p,r:'',m:''};
          });
          const cleanText=raw.replace(/\{[^}]*\}/g,'');
          return{t:cleanText,z:zh,w:wds};
        });
      } else {
        st.customLines=t.split('\n').map(line=>{
          const parts=line.split('|');
          return{t:(parts[0]||'').trim(),z:(parts[1]||'').trim()};
        });
      }
      st.songIdx=null; st.learningSource='custom';
      st.practiceMode=false; st.revealedBlanks.clear();
      if(st.customLang==='ja'){
        jaWordMap={};
        st.customLines.forEach(l=>{
          if(l.w && Array.isArray(l.w)){
            l.w.forEach(wd=>{if(wd.w && wd.r && !jaWordMap[wd.w]) jaWordMap[wd.w]=wd;});
          }
        });
      }
      render();
    };
    window.goBack = function(){
      if(st.learningSource==='library'){
        st.songIdx=null; st.customLines=null;
        st.tab='library';
      } else {
        st.tab='custom';
      }
      st.practiceMode=false; st.revealedBlanks.clear();
      closeWordPanel(); render();
    };
    window.selectWordEN = function(word){speak(word,false,'en');openWP_EN(word);};
    window.selectWordJA = function(word,reading,meaning){speak(word,false,'ja');openWP_JA(word,reading,meaning);};
    window.toggle = function(key){
      if(key==='practiceMode'){st.practiceMode=!st.practiceMode;st.revealedBlanks.clear();}
      else st[key]=!st[key];
      render();
    };
    window.toggleSpeed = function(){st.slowMode=!st.slowMode;render();};
    window.revealBlank = function(li,wi,word,lang){st.revealedBlanks.add(`${li}-${wi}`);speak(word,false,lang);openWP_EN(word);render();};
    window.revealBlankJA = function(li,wi,word){st.revealedBlanks.add(`${li}-${wi}`);const info=lookupJA(word);speak(word,false,'ja');openWP_JA(word,info?info.r:'',info?info.m:'');render();};
    window.speakLine = function(t,lang){speak(t,false,lang);};
    window.speakAll = function(){
      let lines=st.customLines||(st.songIdx!==null?SONGS[st.songIdx].lines:[]);
      const lang=st.curLang||(st.songIdx!==null?SONGS[st.songIdx].lang:'en');
      const text=lines.map(l=>(l.t||'').replace(/\{[^}]*\}/g,'')).filter(Boolean).join(lang==='ja'?'。':'. ');
      speak(text,false,lang);
    };
    window.addVocabEN = function(word){if(inVocab(word,'en'))return;const info=D[word]||{};st.vocab.push({word,phonetic:info.p||'',reading:'',meaning:info.m||'',lang:'en'});openWP_EN(word);render();};
    window.addVocabJA = function(word,reading,meaning){if(inVocab(word,'ja'))return;st.vocab.push({word,phonetic:'',reading:reading||'',meaning:meaning||'',lang:'ja'});openWP_JA(word,reading,meaning);render();};
    window.removeVocab = function(i){st.vocab.splice(i,1);render();};
    window.rmVocabW = function(word,lang){
      st.vocab=st.vocab.filter(v=>!(v.word===word&&v.lang===lang));
      if(lang==='en')openWP_EN(word);
      else{const info=lookupJA(word);openWP_JA(word,info?info.r:'',info?info.m:'');}
      render();
    };

    document.addEventListener('click', function(e){
      const card = e.target.closest('.song-card');
      if(!card || !card.parentNode.classList.contains('song-grid')) return;
      const customId = card.dataset.customId;
      if(customId){
        loadCustomSongById(Number(customId));
        return;
      }
      const builtinIndex = card.dataset.builtinIndex;
      if(builtinIndex !== undefined){
        selectSong(Number(builtinIndex));
      }
    });

    render();
  })();
</script>
</body>
</html>
